name: Profesor Gato - Run Diario

on:
  schedule:
    - cron: "0 13 * * *"   # 7:00am hora Ciudad de México (UTC-6)
  workflow_dispatch:         # permite disparar manualmente desde GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # requerido para commitear el historial de temas de vuelta
      id-token: write   # requerido para Workload Identity Federation

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ffmpeg
        run: |
          for i in 1 2 3; do
            sudo apt-get update --fix-missing && \
            sudo apt-get install -y --fix-missing ffmpeg && break
            echo "Intento $i fallido, reintentando en 15s..."
            sleep 15
          done

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Restaurar credentials.json (Google/YouTube OAuth)
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Restaurar token.json (Google/YouTube OAuth)
        run: echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Autenticar en GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/195684257108/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'profesor-gato@project-71cbc30b-23ca-40b4-a93.iam.gserviceaccount.com'

      - name: Ejecutar pipeline
        env:
          PYTHONIOENCODING: utf-8
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KLING_ACCESS_KEY: ${{ secrets.KLING_ACCESS_KEY }}
          KLING_SECRET_KEY: ${{ secrets.KLING_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SIEVEDANCE_API_KEY: ${{ secrets.SIEVEDANCE_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python run_daily.py --now

      - name: Guardar historial de temas (commit de vuelta)
        if: always()
        run: |
          git config user.name  "profesor-gato-bot"
          git config user.email "bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/topic_history.json)" ]]; then
            git add data/topic_history.json
            git commit -m "chore: actualizar historial de temas [skip ci]"
            git pull --rebase origin master || true
            git push origin HEAD:master
            echo "Historial de temas actualizado y pusheado."
          else
            echo "Sin cambios en el historial de temas."
          fi

      - name: Subir logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 30

      - name: Subir video como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: videos/*.mp4
          retention-days: 30
          if-no-files-found: warn
